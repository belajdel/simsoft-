<button
  class="theme-switcher animate-fade-in"
  (click)="toggleTheme()"
  [attr.aria-label]="currentTheme() === 'light' ? 'Passer en mode sombre' : 'Passer en mode clair'"
  type="button">
  <div class="switcher-container">
    <div class="switcher-track">
      <div class="switcher-thumb" [class.dark]="currentTheme() === 'dark'">
        @if (currentTheme() === 'light') {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="icon">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        } @else {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="icon">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        }
      </div>
    </div>
  </div>
</button>
