<section class="faq-section">
    <div class="faq-container">
        <div class="section-header">
            <h2 class="section-title">{{ languageService.translate('faq_title') }}</h2>
            <p>{{ languageService.translate('faq_subtitle') }}</p>
        </div>

        <div class="faq-list">
            <div class="faq-item glass-card" *ngFor="let item of faqs(); let i = index" [class.open]="item.isOpen">
                <button class="faq-question" (click)="toggle(i)">
                    <span>{{ item.question }}</span>
                    <span class="icon">{{ item.isOpen ? '−' : '+' }}</span>
                </button>
                <div class="faq-answer" [style.max-height]="item.isOpen ? '200px' : '0'">
                    <div class="answer-content">
                        {{ item.answer }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
