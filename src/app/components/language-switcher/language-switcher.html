<div class="language-switcher animate-fade-in" [class.open]="isOpen">
  <button
    class="language-toggle"
    (click)="isOpen = !isOpen"
    [attr.aria-label]="'Changer de langue'"
    type="button"
    [attr.data-language]="currentLanguage()">
    <span class="current-flag">{{ getCurrentLanguage()?.flag }}</span>
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" class="dropdown-arrow" [class.rotated]="isOpen">
      <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  @if (isOpen) {
  <div class="language-dropdown">
    @for (language of languages; track language.code) {
    <button
      class="language-option"
      [class.active]="language.code === currentLanguage()"
      (click)="setLanguage(language.code)"
      type="button">
      <span class="flag">{{ language.flag }}</span>
      <span class="name">{{ language.fullName }}</span>
      @if (language.code === currentLanguage()) {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="check-icon">
        <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      }
    </button>
    }
  </div>
  }
</div>
