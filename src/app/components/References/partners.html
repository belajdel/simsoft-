<section class="partners" id="references">
  <div class="partners-container">
    <div class="section-header">
      <span class="section-label">{{ title() }}</span>
      <h2 class="section-title">{{ subtitle() }}</h2>
      <p class="section-description">
        {{ description() }}
      </p>
    </div>

    <div class="carousel-wrapper" *ngIf="partners.length > 0">
      <button class="carousel-button carousel-button-prev" (click)="previous()" [disabled]="!canGoPrevious()"
        [attr.aria-label]="languageService.translate('previous')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>

      <div class="carousel-container">
        <div class="carousel-track"
          [style.transform]="'translateX(calc(-' + currentIndex() + ' * ((100% + var(--carousel-gap)) / ' + itemsPerView() + ')))'">
          <div class="partner-card" *ngFor="let partner of partners; let i = index"
            [style.animation-delay]="(i * 0.05) + 's'">
            <div class="partner-card-inner">
              <div class="partner-logo-wrapper">
                <div class="logo-background"></div>
                <img [src]="partner.logo" [alt]="partner.name" class="partner-logo"
                  [style.--logo-scale]="partner.scale || 1.15"
                  [style.--logo-hover-scale]="(partner.scale || 1.15) * 0.95"
                  [class.white-logo]="!partner.keepColors && (partner.logo.includes('LOGO-STE-MRASI-Fréres') || partner.logo.includes('AF-beton'))"
                  [class.keep-colors]="partner.keepColors" [class.giant-logo]="partner.isGiant"
                  [class]="'logo-' + partner.name.toLowerCase().split(' ').join('-').split('(').join('').split(')').join('').split('.').join('')"
                  loading="lazy" (error)="$event.target.src='/References/logo-1.png'" />
              </div>
              <div class="partner-hover-effect"></div>
            </div>
          </div>
        </div>
      </div>

      <button class="carousel-button carousel-button-next" (click)="next()" [disabled]="!canGoNext()"
        [attr.aria-label]="languageService.translate('next')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <div class="empty-state" *ngIf="partners.length === 0">
      <p>Les logos de nos références seront affichés ici</p>
    </div>
  </div>
</section>
