<section class="partners" id="references">
  <div class="partners-container">
    <div class="section-header">
      <span class="section-label">Nos Références</span>
      <h2 class="section-title">Ils Nous Font Confiance</h2>
      <p class="section-description">
        Des entreprises de renom qui nous font confiance pour leurs solutions technologiques
      </p>
    </div>

    <div class="carousel-wrapper" *ngIf="partners.length > 0">
      <button class="carousel-button carousel-button-prev" (click)="previous()" [disabled]="!canGoPrevious"
        aria-label="Précédent">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>

      <div class="carousel-container">
        <div class="carousel-track" [style.transform]="'translateX(-' + (currentIndex() * (100 / itemsPerView)) + '%)'">
          <div class="partner-card" *ngFor="let partner of partners; let i = index"
            [style.animation-delay]="(i * 0.05) + 's'">
            <div class="partner-card-inner">
              <div class="partner-logo-wrapper">
                <div class="logo-background"></div>
                <img [src]="partner.logo" [alt]="partner.name" class="partner-logo" loading="lazy"
                  (error)="$event.target.src='/References/logo-1.png'" />
              </div>
              <div class="partner-hover-effect"></div>
            </div>
          </div>
        </div>
      </div>

      <button class="carousel-button carousel-button-next" (click)="next()" [disabled]="!canGoNext"
        aria-label="Suivant">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <div class="empty-state" *ngIf="partners.length === 0">
      <p>Les logos de nos références seront affichés ici</p>
    </div>
  </div>
</section>
