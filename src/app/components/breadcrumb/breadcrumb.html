<nav class="breadcrumb" aria-label="Breadcrumb navigation" *ngIf="breadcrumbs().length > 1">
  <ol class="breadcrumb-list">
    <li class="breadcrumb-item" *ngFor="let item of breadcrumbs(); let i = index; let isLast = last">
      <ng-container *ngIf="!isLast">
        <a [routerLink]="item.url" class="breadcrumb-link" [attr.aria-current]="item.isActive ? 'page' : null">
          <svg *ngIf="i === 0" width="16" height="16" viewBox="0 0 24 24" fill="none" class="breadcrumb-icon">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="9,22 9,12 15,12 15,22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          {{ item.label }}
        </a>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="breadcrumb-separator">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </ng-container>

      <ng-container *ngIf="isLast">
        <span class="breadcrumb-current" aria-current="page">
          {{ item.label }}
        </span>
      </ng-container>
    </li>
  </ol>

  <!-- Back button for mobile -->
  <button class="breadcrumb-back" (click)="goBack()" aria-label="Go back" *ngIf="breadcrumbs().length > 2">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</nav>
